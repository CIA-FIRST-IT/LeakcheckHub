name: leakcheck

x-app-service: &app-service
  image: ghcr.io/cia-first-it/leakcheckhub:latest
  pull_policy: always
  read_only: true
  tmpfs:
    - /tmp:rw,noexec,nosuid,size=64m
  security_opt:
    - no-new-privileges:true
  cap_drop:
    - ALL

services:
  # Diagnostic guard. busybox is published for every architecture and carries the same hardening
  # as the application services, so it isolates two failure modes that look identical in Portainer:
  # an image that cannot execute on this host, and a container runtime rejecting these options.
  # If this passes and `init` still fails, the fault is the application image, not the settings.
  preflight:
    image: busybox:1.37
    pull_policy: missing
    command:
      - sh
      - -c
      - |
        arch=$$(uname -m)
        echo "host architecture: $$arch"
        echo "container runtime reached the entrypoint successfully"
        if [ "$$arch" != "x86_64" ]; then
          echo "FATAL: ghcr.io/cia-first-it/leakcheckhub is built for linux/amd64 only,"
          echo "but this host is $$arch. No service in this stack can start."
          echo "Fix: rebuild the image for $$arch, which first needs requirements.txt"
          echo "regenerated with artifact hashes for that platform."
          exit 1
        fi
        echo "architecture is compatible with the published image"
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    networks:
      - database

  # One-shot. Generates any missing bootstrap secret and exits. Runs as the unprivileged image
  # user: the volume inherits app:app ownership from the image, so no privileged container is
  # needed. Attached to the internal network only, which has no route off the host.
  init:
    <<: *app-service
    command: ["python", "-m", "app.bootstrap_secrets", "init"]
    volumes:
      - bootstrap-secrets:/run/leakcheck-bootstrap
    depends_on:
      preflight:
        condition: service_completed_successfully
    networks:
      - database

  postgres:
    image: postgres:16.8-bookworm
    pull_policy: missing
    restart: unless-stopped
    environment:
      POSTGRES_DB: leakcheck
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD_FILE: /run/leakcheck-bootstrap/postgres-password
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - bootstrap-secrets:/run/leakcheck-bootstrap:ro
    depends_on:
      init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d leakcheck"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 15s
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m
      - /var/run/postgresql:rw,nosuid,size=8m
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - SETGID
      - SETUID
    networks:
      - database

  # Creates the least-privilege database roles, upgrades the schema, then serves the application
  # and drains the batch queue in-process.
  web:
    <<: *app-service
    command: ["python", "-m", "app.bootstrap_secrets", "serve"]
    restart: unless-stopped
    volumes:
      - bootstrap-secrets:/run/leakcheck-bootstrap:ro
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/healthz', timeout=3)"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    ports:
      - "8000:8000"
    networks:
      - application
      - database

networks:
  application:
  database:
    internal: true

volumes:
  bootstrap-secrets:
  postgres-data:
