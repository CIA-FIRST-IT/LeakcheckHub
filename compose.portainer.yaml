name: leakcheck

x-app-service: &app-service
  image: ghcr.io/cia-first-it/leakcheckhub:latest
  pull_policy: always
  read_only: true
  tmpfs:
    - /tmp:rw,noexec,nosuid,size=64m
  cap_drop:
    - ALL
  # no-new-privileges is deliberately absent. Probes measured it, on its own, as the cause of
  # "exec /usr/local/bin/python: operation not permitted" on this host; cap_drop ALL passed. That
  # signature is an AppArmor profile transition being refused while no_new_privs is set, so the
  # fix belongs in the host's AppArmor configuration rather than in this file.

services:
  # One-shot. Generates any missing bootstrap secret and exits. Runs as the unprivileged image
  # user: the volume inherits app:app ownership from the image, so no privileged container is
  # needed. Attached to the internal network only, which has no route off the host.
  init:
    <<: *app-service
    command: ["python", "-m", "app.bootstrap_secrets", "init"]
    volumes:
      - bootstrap-secrets:/run/leakcheck-bootstrap
    networks:
      - database

  postgres:
    image: postgres:16.8-bookworm
    pull_policy: missing
    restart: unless-stopped
    environment:
      POSTGRES_DB: leakcheck
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD_FILE: /run/leakcheck-bootstrap/postgres-password
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - bootstrap-secrets:/run/leakcheck-bootstrap:ro
    depends_on:
      init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d leakcheck"]
      interval: 5s
      timeout: 3s
      retries: 20
      # A redeploy kills the container rather than shutting it down, so the next start replays
      # WAL before accepting connections. Allow for that rather than reporting it as unhealthy.
      start_period: 60s
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m
      - /var/run/postgresql:rw,nosuid,size=8m
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - SETGID
      - SETUID
    networks:
      - database

  # Creates the least-privilege database roles, upgrades the schema, then serves the application
  # and drains the batch queue in-process.
  web:
    <<: *app-service
    command: ["python", "-m", "app.bootstrap_secrets", "serve"]
    restart: unless-stopped
    volumes:
      - bootstrap-secrets:/run/leakcheck-bootstrap:ro
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/healthz', timeout=3)"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    # Port 8000 is Portainer's own Edge-agent tunnel port, so it is unavailable on a host that
    # runs Portainer itself. Override LEAKCHECK_HTTP_PORT in the stack if 8800 is also taken.
    ports:
      - "${LEAKCHECK_HTTP_PORT:-8800}:8000"
    networks:
      - application
      - database

networks:
  application:
  database:
    internal: true

volumes:
  bootstrap-secrets:
  postgres-data:
