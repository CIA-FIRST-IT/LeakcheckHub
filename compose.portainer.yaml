name: leakcheck

x-app-service: &app-service
  image: ghcr.io/cia-first-it/leakcheckhub:latest
  pull_policy: always
  read_only: true
  tmpfs:
    - /tmp:rw,noexec,nosuid,size=64m
  # This host refused to exec the interpreter ("operation not permitted") with an empty
  # capability bounding set and no-new-privileges applied together. The containers still run as
  # an unprivileged user on an internal network with a read-only root filesystem. Re-add these
  # one at a time once the stack is confirmed healthy.

services:
  # TEMPORARY. Three one-shot probes that isolate which hardening option this host rejects.
  # Nothing depends on them, so a probe that fails does not fail the stack: the running services
  # come up normally and the probes' exit codes are the result. In Portainer, show stopped
  # containers and read leakcheck-probe-*: exit 0 means the option is safe to adopt, exit 255
  # means the host refuses to exec the interpreter under it.
  #
  # Remove this block, and apply whatever passed to x-app-service, once the answer is known.
  probe-caps:
    image: ghcr.io/cia-first-it/leakcheckhub:latest
    pull_policy: always
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m
    cap_drop:
      - ALL
    command: ["python", "-c", "print('probe-caps: cap_drop ALL is supported')"]
    networks:
      - database

  probe-nnp:
    image: ghcr.io/cia-first-it/leakcheckhub:latest
    pull_policy: always
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m
    security_opt:
      - no-new-privileges:true
    command: ["python", "-c", "print('probe-nnp: no-new-privileges is supported')"]
    networks:
      - database

  probe-both:
    image: ghcr.io/cia-first-it/leakcheckhub:latest
    pull_policy: always
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    command: ["python", "-c", "print('probe-both: both options together are supported')"]
    networks:
      - database

  # One-shot. Generates any missing bootstrap secret and exits. Runs as the unprivileged image
  # user: the volume inherits app:app ownership from the image, so no privileged container is
  # needed. Attached to the internal network only, which has no route off the host.
  init:
    <<: *app-service
    command: ["python", "-m", "app.bootstrap_secrets", "init"]
    volumes:
      - bootstrap-secrets:/run/leakcheck-bootstrap
    networks:
      - database

  postgres:
    image: postgres:16.8-bookworm
    pull_policy: missing
    restart: unless-stopped
    environment:
      POSTGRES_DB: leakcheck
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD_FILE: /run/leakcheck-bootstrap/postgres-password
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - bootstrap-secrets:/run/leakcheck-bootstrap:ro
    depends_on:
      init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d leakcheck"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 15s
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m
      - /var/run/postgresql:rw,nosuid,size=8m
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - SETGID
      - SETUID
    networks:
      - database

  # Creates the least-privilege database roles, upgrades the schema, then serves the application
  # and drains the batch queue in-process.
  web:
    <<: *app-service
    command: ["python", "-m", "app.bootstrap_secrets", "serve"]
    restart: unless-stopped
    volumes:
      - bootstrap-secrets:/run/leakcheck-bootstrap:ro
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/healthz', timeout=3)"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    # Port 8000 is Portainer's own Edge-agent tunnel port, so it is unavailable on a host that
    # runs Portainer itself. Override LEAKCHECK_HTTP_PORT in the stack if 8800 is also taken.
    ports:
      - "${LEAKCHECK_HTTP_PORT:-8800}:8000"
    networks:
      - application
      - database

networks:
  application:
  database:
    internal: true

volumes:
  bootstrap-secrets:
  postgres-data:
