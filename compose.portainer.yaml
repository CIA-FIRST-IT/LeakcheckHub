name: leakcheck

x-app-service: &app-service
  image: ${LC_IMAGE:-ghcr.io/cia-first-it/leakcheckhub:latest}
  pull_policy: always
  read_only: true
  tmpfs:
    - /tmp:rw,noexec,nosuid,size=64m
  security_opt:
    - no-new-privileges:true
  cap_drop:
    - ALL

x-runtime-environment: &runtime-environment
  LC_ENVIRONMENT: production
  LC_DATABASE_URL: postgresql+asyncpg://leakcheck_runtime:${LC_RUNTIME_DB_PASSWORD:?set LC_RUNTIME_DB_PASSWORD in Portainer}@postgres:5432/leakcheck
  LC_SESSION_SECRET: ${LC_SESSION_SECRET:?set LC_SESSION_SECRET in Portainer}
  LC_DATA_KEY: ${LC_DATA_KEY:?set LC_DATA_KEY in Portainer}
  LC_TRUSTED_HOSTS: ${LC_TRUSTED_HOSTS:?set LC_TRUSTED_HOSTS in Portainer}
  LC_ADMIN_LOGIN_MAX_FAILURES: ${LC_ADMIN_LOGIN_MAX_FAILURES:-5}
  LC_ADMIN_LOGIN_LOCKOUT_SECONDS: ${LC_ADMIN_LOGIN_LOCKOUT_SECONDS:-900}
  LC_ADMIN_LOGIN_IP_MAX_FAILURES: ${LC_ADMIN_LOGIN_IP_MAX_FAILURES:-10}
  LC_ADMIN_LOGIN_IP_WINDOW_SECONDS: ${LC_ADMIN_LOGIN_IP_WINDOW_SECONDS:-900}
  LC_ADMIN_LOGIN_IP_LOCKOUT_SECONDS: ${LC_ADMIN_LOGIN_IP_LOCKOUT_SECONDS:-900}

services:
  postgres:
    image: postgres:16.8-bookworm
    pull_policy: missing
    restart: unless-stopped
    environment:
      POSTGRES_DB: leakcheck
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${LC_POSTGRES_PASSWORD:?set LC_POSTGRES_PASSWORD in Portainer}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d leakcheck"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 15s
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m
      - /var/run/postgresql:rw,nosuid,size=8m
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - SETGID
      - SETUID
    networks:
      - database

  bootstrap:
    <<: *app-service
    command: ["python", "-m", "app.bootstrap_database"]
    environment:
      LC_MIGRATION_DATABASE_URL: postgresql+asyncpg://postgres:${LC_POSTGRES_PASSWORD:?set LC_POSTGRES_PASSWORD in Portainer}@postgres:5432/leakcheck
      LC_MIGRATOR_DB_PASSWORD: ${LC_MIGRATOR_DB_PASSWORD:?set LC_MIGRATOR_DB_PASSWORD in Portainer}
      LC_RUNTIME_DB_PASSWORD: ${LC_RUNTIME_DB_PASSWORD:?set LC_RUNTIME_DB_PASSWORD in Portainer}
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - database

  migrate:
    <<: *app-service
    command: ["alembic", "upgrade", "head"]
    environment:
      LC_MIGRATION_DATABASE_URL: postgresql+asyncpg://leakcheck_migrator:${LC_MIGRATOR_DB_PASSWORD:?set LC_MIGRATOR_DB_PASSWORD in Portainer}@postgres:5432/leakcheck
    depends_on:
      bootstrap:
        condition: service_completed_successfully
    networks:
      - database

  web:
    <<: *app-service
    restart: unless-stopped
    environment: *runtime-environment
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/healthz', timeout=3)"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s
    ports:
      - "${LC_HTTP_BIND:-0.0.0.0}:${LC_HTTP_PORT:-8000}:8000"
    networks:
      - application
      - database

  worker:
    <<: *app-service
    command: ["python", "-m", "app.worker"]
    restart: unless-stopped
    environment: *runtime-environment
    depends_on:
      migrate:
        condition: service_completed_successfully
    networks:
      - application
      - database

networks:
  application:
  database:
    internal: true

volumes:
  postgres-data:
